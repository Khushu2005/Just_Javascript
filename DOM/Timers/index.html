<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OTP Verification</title>
    <link rel="stylesheet" href="style.css">
</head>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: Arial, sans-serif;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #f5f5f5;
    }

    .otp-container {
        width: 380px;
        padding: 35px;
        background: white;
        border-radius: 12px;
        text-align: center;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
    }

    h1 {
        margin-bottom: 10px;
        font-size: 28px;
    }

    .subtitle {
        color: #777;
        font-size: 14px;
        margin-bottom: 25px;
    }

    .otp-box {
        display: flex;
        justify-content: center;
        gap: 10px;
        margin-bottom: 25px;
    }

    .otp-box input {
        width: 45px;
        height: 50px;
        text-align: center;
        font-size: 20px;
        border: 1px solid #ccc;
        border-radius: 7px;
        outline: none;
    }

    .otp-box input:focus {
        border-color: #222;
    }

    #verifyBtn {
        width: 100%;
        padding: 12px;
        border: none;
        border-radius: 7px;
        background: #222;
        color: white;
        cursor: pointer;
        font-size: 15px;
    }

    .timer {
        margin-top: 20px;
        font-size: 14px;
        color: #666;
    }

    #timer {
        font-weight: bold;
        color: #222;
    }

    #resendBtn {
        margin-top: 10px;
        border: none;
        background: transparent;
        color: #222;
        font-weight: bold;
        cursor: pointer;
    }

    #resendBtn:disabled {
        color: #aaa;
        cursor: not-allowed;
    }

    #message {
        display: block;
        margin-top: 15px;
        font-size: 14px;
    }
</style>

<body>

    <div class="otp-container">

        <h1>Verify OTP</h1>

        <p class="subtitle">
            Enter the 6-digit OTP sent to your email
        </p>

        <div class="otp-box">
            <input class="otpinput" type="text" maxlength="1">
            <input class="otpinput" type="text" maxlength="1">
            <input class="otpinput" type="text" maxlength="1">
            <input class="otpinput" type="text" maxlength="1">
            <input class="otpinput" type="text" maxlength="1">
            <input class="otpinput" type="text" maxlength="1">
        </div>

        <button id="verifyBtn">Verify OTP</button>

        <p class="timer">
            Resend OTP in <span id="timer">30</span>s
        </p>

        <button id="resendBtn" disabled>
            Resend OTP
        </button>

        <span id="message"></span>

    </div>

    <script src="script.js"></script>
</body>

</html>
